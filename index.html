<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail d'Ingénierie Documentaire - Géomatique & Topographie</title>
    
    <style>
        /* ==========================================================================
           VARIABLES GLOBALES DE THÉMATISATION (DESIGN SYSTEM - MODE CLAIR)
           ========================================================================== */
        :root {
            --primary-dark: #1a202c;       /* Anthracite profond pour les textes majeurs */
            --accent-red: #c53030;         /* Rouge institutionnel pour l'état actif et les titres */
            --bg-main: #f7fafc;            /* Fond de page neutre pour limiter la fatigue visuelle */
            --card-bg: #ffffff;            /* Blanc pur assurant le détachement des cartes */
            --text-muted: #718096;         /* Gris intermédiaire pour les métadonnées et sous-titres */
            --border-light: #e2e8f0;       /* Gris de délimitation pour les lignes de séparation */
            --input-bg: #ffffff;           /* Fond des champs de saisie */
            --radius-md: 12px;             /* Rayon de courbure des angles des cartes */
            --radius-sm: 6px;              /* Rayon de courbure pour les boutons de filtrage */
        }

        /* ==========================================================================
           SURCHARGE DE THÉMATISATION (DESIGN SYSTEM - MODE SOMBRE)
           JUSTIFICATION CSS : L'utilisation de variables de même nom permet une bascule 
           immédiate de l'ensemble de l'interface par simple permutation de classe sur le body.
           ========================================================================== */
        body.dark-theme {
            --primary-dark: #f7fafc;       /* Inversion : le texte majeur devient clair */
            --accent-red: #fc8181;         /* Rouge atténué pour optimiser le contraste sur fond sombre */
            --bg-main: #0f172a;            /* Bleu nuit profond pour le fond général (anti-éblouissement) */
            --card-bg: #1e293b;            /* Gris-bleu ardoise pour les modules de cartes */
            --text-muted: #94a3b8;         /* Gris clair pour les textes secondaires */
            --border-light: #334155;       /* Assombrissement des bordures de séparation */
            --input-bg: #1e293b;           /* Fond des inputs aligné sur les cartes */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--primary-dark);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           STRUCTURE DE LA PAGE ET MISES EN PAGE (FLEXBOX & GRID)
           ========================================================================== */
        
        /* FLEXBOX : Organisation horizontale de l'en-tête. Permet d'isoler le bloc de titre 
           à gauche et les commandes utilitaires (Thème / Cache) à l'extrémité droite. */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* BARRE DE CONTRÔLE INTERMÉDIAIRE : Reçoit le champ de recherche et les boutons. */
        .control-panel {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* BARRE DE RECHERCHE TEXTUELLE */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--input-bg);
            color: var(--primary-dark);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-red);
        }

        /* BLOCS DE FILTRAGE PAR CATÉGORIES (FLEXBOX INTERNE) */
        .category-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }

        .category-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            min-width: 120px;
        }

        /* COMPOSANTS BOUTONS */
        .filter-btn {
            background-color: var(--bg-main);
            color: var(--primary-dark);
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-btn:hover {
            background-color: var(--border-light);
        }

        .filter-btn.active {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-red);
            box-shadow: 0 2px 4px rgba(197, 48, 48, 0.2);
        }

        .filter-btn.clear-all {
            border-style: dashed;
            font-weight: 700;
        }

        /* GRID LAYOUT : Grille de distribution des cartes d'actualités.
           Calcule le nombre de colonnes optimal de manière fluide sans media queries. */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        /* ==========================================================================
           COMPOSANTS : STRUCTURE DES CARTES GRAPHIC COMPONENT
           ========================================================================== */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-image-wrapper {
            width: 100%;
            height: 160px;
            background: var(--border-light);
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
        }

        .card-image-placeholder svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-source {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 10px 0;
            color: var(--primary-dark);
        }

        .card-excerpt {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        .translated-text {
            border-left: 2px solid #3182ce;
            padding-left: 6px;
            font-style: italic;
        }
        
        .translated-title {
            border-left: 2px solid #3182ce;
            padding-left: 6px;
            display: block;
        }

        .card-date {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: auto;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div>
            <h1>Veille Technologique & Pédagogique - BTS MGTMN</h1>
            <small id="cache-status" style="color: var(--text-muted);">Synchronisation réseau active...</small>
        </div>
        <div class="header-actions">
            <button class="filter-btn" id="btn-refresh-cache" title="Forcer la purge du cache local et réinterroger les serveurs distants">🔄 Actualiser</button>
            <button class="filter-btn" id="btn-toggle-theme" title="Basculer entre le mode clair et le mode sombre">🌓 Thème</button>
        </div>
    </header>

    <section class="control-panel">
        <div class="search-wrapper">
            <input type="text" id="search-bar" class="search-input" placeholder="Rechercher un mot-clé, un logiciel, un capteur...">
        </div>
        
        <div id="categories-filter-box">
            <div class="category-group">
                <span class="category-label">Général :</span>
                <button class="filter-btn clear-all active" id="btn-master-clear">🗂️ Tout afficher</button>
            </div>
            </div>
    </section>

    <main id="timeline-container" class="timeline-grid">
        <div class="loader" id="main-loader">Initialisation du cache et chargement des flux...</div>
    </main>

    <script>
        /* ==========================================================================
           DICTIONNAIRE DE MAPPING MÉTIER ET CONFIGURATION DU CACHE
           ========================================================================== */
        
        // CORRESPONDANCE DES SOURCES : Permet de classifier sémantiquement chaque flux RSS
        // afin de bâtir des filtres d'arborescence adaptés au référentiel de formation.
        const DICTIONNAIRE_CATEGORIES = {
            "qgis.org blog": "sig", "arcorama": "sig", "release notes from webodm": "sig", "release notes from cloudcompare": "sig", "agisoft photoscan": "sig",
            "eu agency for the space programme - linking space to user needs": "materiel", "dronelife": "materiel", "lidar news": "materiel", "news": "materiel", "gps world": "materiel", "geospatial world": "materiel",
            "flux rss des actualités": "institution", "conseil national de l'information géolocalisée - actualités": "institution", "cerema - actualité": "institution", "press releases": "institution", "ministère du partenariat avec les territoires et de la décentralisation ministère de la transition écologique, de l’énergie, du climat et de la prévention des risques ministère du logement et de la ré": "institution",
            "epos-france": "science", "institut de physique du globe de paris": "science", "copernicus": "science", "theia": "science", "esa france": "science", "nasa": "science", "infoterre": "science", "\"collège de france\" - google actualités": "science"
        };

        // LIBELLÉS DES THÉMATIQUES MÉTIERS
        const NOMS_CATEGORIES = {
            "sig": "Logiciels & SIG",
            "materiel": "Matériel & Capteurs",
            "institution": "Institutions & Normes",
            "science": "Sciences & Spatial"
        };

        // PARAMÈTRES DU CACHE LOCAL
        const CACHE_KEY_DATA = "veille_topo_data_v2";
        const CACHE_KEY_TIME = "veille_topo_timestamp_v2";
        const DUREE_CACHE = 3600000; // Persistance fixée à 1 heure (en millisecondes)

        // REGISTRES ET ÉTATS DE L'APPLICATION
        let baseArticlesGlobal = [];
        let listeSourcesUniques = new Set();
        let sourcesActives = new Set();
        let termeRechercheGlobal = "";

        document.addEventListener("DOMContentLoaded", () => {
            configurerCommutateurTheme();
            configurerBarreRecherche();
            configurerBoutonRafraichissement();
            gererCycleDeVieDonnees();
        });

        /* ==========================================================================
           FONCTIONS DE GESTION DU THÉMATISME ET DE L'INTERACTION UTILISATEUR
           ========================================================================== */

        /**
         * @function configurerCommutateurTheme
         * @description Initialise le mode sombre en vérifiant les préférences antérieures 
         * stockées de l'utilisateur ou en appliquant l'événement de bascule au clic.
         */
        function configurerCommutateurTheme() {
            const btn = document.getElementById("btn-toggle-theme");
            if (localStorage.getItem("theme_sombre") === "true") {
                document.body.classList.add("dark-theme");
            }
            btn.addEventListener("click", () => {
                document.body.classList.toggle("dark-theme");
                localStorage.setItem("theme_sombre", document.body.classList.contains("dark-theme"));
            });
        }

        /**
         * @function configurerBarreRecherche
         * @description Attache un écouteur sur le champ textuel pour intercepter la saisie
         * et recalculer à la volée la visibilité des cartes sans requêter le réseau.
         */
        function configurerBarreRecherche() {
            const barre = document.getElementById("search-bar");
            barre.addEventListener("input", (e) => {
                termeRechercheGlobal = e.target.value.toLowerCase().trim();
                genererRenduInterface();
            });
        }

        /**
         * @function configurerBoutonRafraichissement
         * @description Permet à l'utilisateur de forcer l'effacement du cache pour actualiser les données.
         */
        function configurerBoutonRafraichissement() {
            document.getElementById("btn-refresh-cache").addEventListener("click", () => {
                localStorage.removeItem(CACHE_KEY_DATA);
                localStorage.removeItem(CACHE_KEY_TIME);
                location.reload();
            });
        }

        /* ==========================================================================
           PIPELINE D'ACQUISITION DES DONNÉES (CACHE VS RÉSEAU)
           ========================================================================== */

        /**
         * @function gererCycleDeVieDonnees
         * @description Implémente l'algorithme de mise en cache locale (Client-Side Caching).
         * Évalue l'âge du cache. Si valide, charge instantanément ; sinon, interroge le réseau.
         */
        async function gererCycleDeVieDonnees() {
            const cacheTimestamp = localStorage.getItem(CACHE_KEY_TIME);
            const cacheDonnees = localStorage.getItem(CACHE_KEY_DATA);
            const instantPresent = Date.now();

            // LOGIQUE DE VALIDATION : Double vérification de présence et d'obsolescence temporelle
            if (cacheTimestamp && cacheDonnees && (instantPresent - cacheTimestamp < DUREE_CACHE)) {
                baseArticlesGlobal = JSON.parse(cacheDonnees);
                
                // Extraction des sources uniques depuis les données du cache pour reconstituer les filtres
                baseArticlesGlobal.forEach(art => listeSourcesUniques.add(art.titreSource));
                
                const minutesRestantes = Math.round((DUREE_CACHE - (instantPresent - cacheTimestamp)) / 60000);
                document.getElementById("cache-status").textContent = `Données locales (MàJ réseau dans ${minutesRestantes} min)`;
                
                genererStructureBoutonsCategories();
                genererRenduInterface();
            } else {
                document.getElementById("cache-status").textContent = `Requêtage des serveurs distants en cours...`;
                await initialiserCollecteReseau();
            }
        }

        /**
         * @function initialiserCollecteReseau
         * @description Charge le fichier d'infrastructure OPML et parallélise les requêtes vers les flux RSS.
         */
        async function initialiserCollecteReseau() {
            try {
                const reponse = await fetch('feeds.opml');
                if (!reponse.ok) throw new Error("Fichier 'feeds.opml' absent de la racine.");
                
                const chaineDonnees = await reponse.text();
                const parseur = new DOMParser();
                const documentXML = parseur.parseFromString(chaineDonnees, "text/xml");
                
                if (documentXML.querySelector("parsererror")) throw new Error("Erreur de syntaxe dans le fichier OPML.");
                
                const elementsOutline = documentXML.querySelectorAll("outline[xmlUrl]");
                
                // PARALLÉLISATION ASYNCHRONE : Lancement simultané des requêtes pour optimiser les performances
                const promessesCollecte = Array.from(elementsOutline).map(outline => {
                    const titreSource = outline.getAttribute("title") || outline.getAttribute("text") || "Source";
                    const urlFlux = outline.getAttribute("xmlUrl");
                    return collecterDonneesFlux(titreSource, urlFlux);
                });
                
                await Promise.all(promessesCollecte);
                
                // Tri chronologique des structures normalisées par soustraction de timestamps
                baseArticlesGlobal.sort((a, b) => b.dateTimestamp - a.dateTimestamp);
                
                // PERSISTANCE DES DONNÉES : Stockage local du résultat pour les sessions futures
                try {
                    localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(baseArticlesGlobal));
                    localStorage.setItem(CACHE_KEY_TIME, Date.now().toString());
                    document.getElementById("cache-status").textContent = `Flux synchronisés avec succès (Cache activé)`;
                } catch (e) {
                    console.warn("Quota d'espace de stockage LocalStorage excédé.");
                }
                
                genererStructureBoutonsCategories();
                genererRenduInterface();
                
            } catch (erreur) {
                document.getElementById("timeline-container").innerHTML = `<div class="loader" style="color:#c53030;">Erreur d'infrastructure : ${erreur.message}</div>`;
            }
        }

        /**
         * @function collecterDonneesFlux
         * @description Récupère un flux unique via proxy, extrait et normalise ses attributs (Titres, dates, images, résumés).
         */
        async function collecterDonneesFlux(titreSource, urlFlux) {
            const urlRequeteProxiee = `https://corsproxy.io/?${encodeURIComponent(urlFlux)}`;
            
            try {
                const reponse = await fetch(urlRequeteProxiee);
                if (!reponse.ok) return;
                
                const texteBrut = await reponse.text();
                const parseur = new DOMParser();
                const xmlDoc = parseur.parseFromString(texteBrut, "text/xml");
                
                const estAtom = xmlDoc.querySelector("entry") !== null;
                const balisesArticles = estAtom ? xmlDoc.querySelectorAll("entry") : xmlDoc.querySelectorAll("item");
                
                if (balisesArticles.length > 0) {
                    listeSourcesUniques.add(titreSource);
                }

                Array.from(balisesArticles).slice(0, 5).forEach(article => {
                    const titreArticle = article.querySelector("title")?.textContent || "Sans titre";
                    let lienArticle = estAtom ? article.querySelector("link")?.getAttribute("href") : article.querySelector("link")?.textContent;
                    
                    let chaineDate = article.querySelector("pubDate")?.textContent || 
                                     article.querySelector("updated")?.textContent || 
                                     article.querySelector("published")?.textContent || 
                                     article.querySelector("date")?.textContent || "";
                    
                    if (!chaineDate) {
                        const dcDate = article.getElementsByTagName("dc:date")[0];
                        if (dcDate) chaineDate = dcDate.textContent;
                    }
                    
                    const dateObjet = chaineDate ? new Date(chaineDate.trim()) : new Date(0);
                    const dateEstValide = !isNaN(dateObjet.getTime()) && dateObjet.getTime() !== 0;
                    
                    let descriptionBrute = article.querySelector("description")?.textContent || article.querySelector("summary")?.textContent || "";
                    const fauxDiv = document.createElement("div");
                    fauxDiv.innerHTML = descriptionBrute;
                    const extraitTexte = fauxDiv.textContent || fauxDiv.innerText || "";
                    
                    let urlImage = null;
                    const enclosure = article.querySelector("enclosure[type^='image']");
                    if (enclosure) urlImage = enclosure.getAttribute("url");
                    
                    if (!urlImage) {
                        const mediaContent = article.getElementsByTagName("media:content")[0] || article.getElementsByTagName("media:thumbnail")[0];
                        if (mediaContent) urlImage = mediaContent.getAttribute("url");
                    }
                    
                    if (!urlImage) {
                        const correspondence = descriptionBrute.match(/<img[^>]+src="([^">]+)"/i);
                        if (correspondence && correspondence[1]) urlImage = correspondence[1];
                    }

                    baseArticlesGlobal.push({
                        titreSource: titreSource,
                        titreArticle: titreArticle.trim(),
                        lien: lienArticle ? lienArticle.trim() : "#",
                        extrait: extraitTexte.trim(),
                        dateTimestamp: dateEstValide ? dateObjet.getTime() : 0,
                        dateAffichee: dateEstValide ? dateObjet.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'}) : "Date inconnue",
                        urlImage: urlImage
                    });
                });
            } catch (e) {}
        }

        /* ==========================================================================
           CONSTRUCTION DYNAMIQUE DE L'INTERFACE DE FILTRAGE PAR CATÉGORIES
           ========================================================================== */

        /**
         * @function genererStructureBoutonsCategories
         * @description Analyse l'ensemble des sources, les trie par groupe métier, 
         * et génère l'architecture des boutons de filtrage sous le titre.
         */
        function genererStructureBoutonsCategories() {
            const boitePrincipale = document.getElementById("categories-filter-box");
            
            // Initialisation d'une structure de regroupement temporaire
            let distribution = { "sig": [], "materiel": [], "institution": [], "science": [], "autres": [] };
            
            // Répartition des sources selon le dictionnaire de mapping normalisé en minuscules
            listeSourcesUniques.forEach(source => {
                const sourceCle = source.toLowerCase().replace(/\s+/g, ' ').trim();
                const codeCat = DICTIONNAIRE_CATEGORIES[sourceCle] || "autres";
                distribution[codeCat].push(source);
            });

            // Injection géométrique des lignes de boutons
            for (const [idCategorie, tableauSources] of Object.entries(distribution)) {
                if (tableauSources.length === 0 || idCategorie === "autres") continue;
                
                const conteneurLigne = document.createElement("div");
                conteneurLigne.className = "category-group";
                
                const étiquette = document.createElement("span");
                étiquette.className = "category-label";
                étiquette.textContent = NOMS_CATEGORIES[idCategorie] + " :";
                conteneurLigne.appendChild(étiquette);
                
                // Tri alphabétique des boutons éditeurs au sein de leur catégorie
                tableauSources.sort().forEach(source => {
                    const bouton = document.createElement("button");
                    bouton.className = "filter-btn";
                    bouton.textContent = source;
                    
                    bouton.addEventListener("click", () => {
                        document.getElementById("btn-master-clear").classList.remove("active");
                        
                        if (sourcesActives.has(source)) {
                            sourcesActives.delete(source);
                            bouton.classList.remove("active");
                        } else {
                            sourcesActives.add(source);
                            bouton.classList.add("active");
                        }
                        
                        if (sourcesActives.size === 0) {
                            document.getElementById("btn-master-clear").classList.add("active");
                        }
                        genererRenduInterface();
                    });
                    conteneurLigne.appendChild(bouton);
                });
                
                boitePrincipale.appendChild(conteneurLigne);
            }

            // Configuration du comportement du bouton Maître "Tout afficher"
            document.getElementById("btn-master-clear").addEventListener("click", function() {
                sourcesActives.clear();
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                genererRenduInterface();
            });
        }

        /* ==========================================================================
           ALGORITHME DE RENDU ET TRADUCTION ASYNCHRONE POST-RENDU
           ========================================================================== */

        /**
         * @function genererRenduInterface
         * @description Applique le triptyque de filtrage (Catégories, Boutons de sources, Mots-clés de recherche),
         * vide la grille, reconstruit les modules de cartes et amorce la détection linguistique.
         */
        function genererRenduInterface() {
            const conteneurGrid = document.getElementById("timeline-container");
            const loaderInitial = document.getElementById("main-loader");
            if (loaderInitial) loaderInitial.remove();
            
            conteneurGrid.innerHTML = ""; // Purge complète de la grille
            
            // EXÉCUTION DU FILTRAGE MULTICRITÈRE COMPOSE
            const articlesFiltres = baseArticlesGlobal.filter(art => {
                const passeFiltreSource = sourcesActives.size === 0 || sourcesActives.has(art.titreSource);
                const passeFiltreTexte = !termeRechercheGlobal || 
                                         art.titreArticle.toLowerCase().includes(termeRechercheGlobal) || 
                                         art.extrait.toLowerCase().includes(termeRechercheGlobal);
                return passeFiltreSource && passeFiltreTexte;
            });
            
            if (articlesFiltres.length === 0) {
                conteneurGrid.innerHTML = "<div class='loader'>Aucun résultat ne correspond à vos critères de recherche.</div>";
                return;
            }
            
            // Construction géométrique du DOM des cartes
            articlesFiltres.forEach(art => {
                const elementCarte = document.createElement("a");
                elementCarte.className = "article-card";
                elementCarte.href = art.lien;
                elementCarte.target = "_blank"; // Respect absolu du lien d'origine externe
                
                const jetonAleatoire = Math.random().toString(36).substring(2, 11);
                const idTitre = 't-' + jetonAleatoire;
                const idExtrait = 'e-' + jetonAleatoire;
                
                let blocMediaHTML = `
                    <div class="card-image-placeholder">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>`;
                    
                if (art.urlImage) {
                    blocMediaHTML = `<img src="${art.urlImage}" class="card-image" alt="Illustration" loading="lazy">`;
                }
                
                elementCarte.innerHTML = `
                    <div class="card-image-wrapper">
                        ${blocMediaHTML}
                    </div>
                    <div class="card-content">
                        <span class="card-source">${art.titreSource}</span>
                        <h2 class="card-title" id="${idTitre}">${art.titreArticle}</h2>
                        <p class="card-excerpt" id="${idExtrait}">${art.extrait ? art.extrait : "Consulter la plateforme d'origine pour analyser cette ressource."}</p>
                        <div class="card-date">Publié le ${art.dateAffichee}</div>
                    </div>
                `;
                conteneurGrid.appendChild(elementCarte);

                // DÉTECTION LINGUISTIQUE (Heuristique basée sur les marqueurs grammaticaux anglophones)
                const regexAnglais = /\b(the|and|of|in|to|for|with|on|at|by|from|new|release|software|drone|satellite|surveying|update|news|gps|world|lidar|geospatial)\b/i;

                if (art.titreArticle && regexAnglais.test(art.titreArticle)) {
                    lancerTraductionAsynchrone(idTitre, art.titreArticle, true);
                }
                if (art.extrait && !art.extrait.startsWith("Consulter") && regexAnglais.test(art.extrait)) {
                    lancerTraductionAsynchrone(idExtrait, art.extrait, false);
                }
            });
        }

        /**
         * @function lancerTraductionAsynchrone
         * @description Interroge l'API de traduction en tâche de fond (sans figer l'interface), 
         * traite la matrice de réponse JSON et met à jour l'élément ciblé dans la carte.
         */
        async function lancerTraductionAsynchrone(idDOM, texteOriginal, estUnTitre) {
            const urlTraduction = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q=${encodeURIComponent(texteOriginal)}`;
            
            try {
                const reponse = await fetch(urlTraduction);
                if (!reponse.ok) return;
                
                const structureJson = await reponse.json();
                let texteTraduitUnifie = "";
                
                if (structureJson && structureJson[0]) {
                    structureJson[0].forEach(segment => {
                        if (segment[0]) texteTraduitUnifie += segment[0];
                    });
                }
                
                if (texteTraduitUnifie && texteTraduitUnifie.trim() !== texteOriginal.trim()) {
                    const noeudCible = document.getElementById(idDOM);
                    if (noeudCible) {
                        const classeAppliquee = estUnTitre ? 'translated-title' : 'translated-text';
                        noeudCible.innerHTML = `<span class="${classeAppliquee}" title="Traduit automatiquement du texte original">${texteTraduitUnifie} ✨</span>`;
                    }
                }
            } catch (erreur) {}
        }
    </script>
</body>
