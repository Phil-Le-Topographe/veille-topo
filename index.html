<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Veille Dynamique Traduit - Géomatique & Topographie</title>
    
    <style>
        /* ==========================================================================
           VARIABLES GLOBALES DE THÉMATISATION (DESIGN SYSTEM)
           ========================================================================== */
        :root {
            --primary-dark: #1a202c;     /* Anthracite profond pour les textes majeurs */
            --accent-red: #c53030;       /* Rouge institutionnel pour l'état actif et les titres */
            --bg-main: #f7fafc;          /* Fond de page neutre pour limiter la fatigue visuelle */
            --card-bg: #ffffff;          /* Blanc pur assurant le détachement des cartes */
            --text-muted: #718096;       /* Gris intermédiaire pour les métadonnées et sous-titres */
            --border-light: #e2e8f0;     /* Gris de délimitation pour les lignes de séparation */
            --radius-md: 12px;           /* Rayon de courbure des angles des cartes */
            --radius-sm: 6px;            /* Rayon de courbure pour les boutons de filtrage */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--primary-dark);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* ==========================================================================
           JUSTIFICATION DE LA MISE EN PAGE ET DE L'ARCHITECTURE GRAPHIQUE
           ========================================================================== */
        
        /* FLEXBOX : Alignement horizontal de l'en-tête principal. L'utilisation de 
           'space-between' projette le titre à gauche et l'indicateur de configuration à droite. */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-light);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 0;
        }

        /* BARRE DE FILTRAGE (FLEXBOX) : Le choix de Flexbox avec 'flex-wrap: wrap' 
           permet aux boutons de se réorganiser proprement sur plusieurs lignes sur support mobile. */
        .filter-bar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-light);
            padding: 15px 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            background-color: var(--bg-main);
            color: var(--primary-dark);
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-btn:hover {
            background-color: #edf2f7;
            border-color: #cbd5e0;
        }

        .filter-btn.active {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-red);
            box-shadow: 0 2px 4px rgba(197, 48, 48, 0.2);
        }

        .filter-btn.clear-all {
            border-style: dashed;
            font-weight: 700;
        }

        /* GRID LAYOUT : Architecture pour l'affichage des cartes de taille unifiée.
           La fonction minmax(300px, 1fr) impose une contrainte de largeur minimale de 300px par carte. */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        /* ==========================================================================
           COMPOSANTS : STRUCTURE DU BLOC DE CARTE (CARD ARCHITECTURE)
           ========================================================================== */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-image-wrapper {
            width: 100%;
            height: 180px;
            background: #e2e8f0;
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
        }

        .card-image-placeholder svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-source {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 10px 0;
            color: var(--primary-dark);
        }

        .card-excerpt {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Justification CSS : Bordure bleue distinctive appliquée aux éléments traduits 
           pour avertir l'utilisateur d'un traitement algorithmique automatique. */
        .translated-text {
            border-left: 2px solid #3182ce;
            padding-left: 6px;
            font-style: italic;
            color: #2d3748;
        }
        
        .translated-title {
            border-left: 2px solid #3182ce;
            padding-left: 6px;
            color: var(--primary-dark);
            display: block;
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: auto;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Veille Technologique & Pédagogique - BTS MGTMN</h1>
        <small id="config-label" style="color: var(--text-muted);">Traduction automatique des titres et extraits active</small>
    </header>

    <section id="filter-container" class="filter-bar"></section>

    <main id="timeline-container" class="timeline-grid">
        <div class="loader" id="main-loader">Initialisation de l'infrastructure de veille, des filtres et des traductions...</div>
    </main>

    <script>
        // REGISTRES DE DONNÉES GLOBAUX
        let baseArticlesGlobal = [];          // Contient l'ensemble normalisé des articles
        let listeSourcesUniques = new Set();  // Liste brute des éditeurs uniques découverts
        let sourcesActives = new Set();       // Liste des filtres sélectionnés par l'utilisateur

        document.addEventListener("DOMContentLoaded", () => {
            initialiserApplication();
        });

        /**
         * @function initialiserApplication
         * @description Gère l'initialisation asynchrone de l'application, coordonne les requêtes HTTP,
         * déclenche la construction de la barre de filtres et injecte le rendu graphique.
         * @param {void}
         * @returns {Promise<void>}
         */
        async function initialiserApplication() {
            try {
                const reponse = await fetch('feeds.opml');
                if (!reponse.ok) throw new Error("Fichier 'feeds.opml' introuvable.");
                
                const chaineDonnees = await reponse.text();
                const parseur = new DOMParser();
                const documentXML = parseur.parseFromString(chaineDonnees, "text/xml");
                
                const elementsOutline = documentXML.querySelectorAll("outline[xmlUrl]");
                
                const promessesCollecte = Array.from(elementsOutline).map(outline => {
                    const titreSource = outline.getAttribute("title") || outline.getAttribute("text") || "Source";
                    const urlFlux = outline.getAttribute("xmlUrl");
                    return collecterDonneesFlux(titreSource, urlFlux);
                });
                
                await Promise.all(promessesCollecte);
                
                // Tri chronologique descendant
                baseArticlesGlobal.sort((a, b) => b.dateObjet - a.dateObjet);
                
                // Construction et affichage
                genererBoutonsFiltrage();
                genererRenduInterface();
                
            } catch (erreur) {
                document.getElementById("timeline-container").innerHTML = `<div class="loader" style="color:#c53030;">Erreur critique : ${erreur.message}</div>`;
            }
        }

        /**
         * @function collecterDonneesFlux
         * @description Gère l'acquisition asynchrone des flux et normalise les objets articles.
         * @param {string} titreSource - Nom de l'éditeur de la source.
         * @param {string} urlFlux - URL d'accès au flux de syndication.
         * @returns {Promise<void>}
         */
        async function collecterDonneesFlux(titreSource, urlFlux) {
            const urlRequeteProxiee = `https://corsproxy.io/?${encodeURIComponent(urlFlux)}`;
            
            try {
                const reponse = await fetch(urlRequeteProxiee);
                if (!reponse.ok) return; 
                
                const texteBrut = await reponse.text();
                const parseur = new DOMParser();
                const xmlDoc = parseur.parseFromString(texteBrut, "text/xml");
                
                const estAtom = xmlDoc.querySelector("entry") !== null;
                const balisesArticles = estAtom ? xmlDoc.querySelectorAll("entry") : xmlDoc.querySelectorAll("item");
                
                if (balisesArticles.length > 0) {
                    listeSourcesUniques.add(titreSource);
                }

                Array.from(balisesArticles).slice(0, 5).forEach(article => {
                    const titreArticle = article.querySelector("title")?.textContent || "Sans titre";
                    let lienArticle = estAtom ? article.querySelector("link")?.getAttribute("href") : article.querySelector("link")?.textContent;
                    
                    let chaineDate = article.querySelector("pubDate")?.textContent || 
                                     article.querySelector("updated")?.textContent || 
                                     article.querySelector("published")?.textContent || 
                                     article.querySelector("date")?.textContent || "";
                    
                    if (!chaineDate) {
                        const dcDate = article.getElementsByTagName("dc:date")[0];
                        if (dcDate) chaineDate = dcDate.textContent;
                    }
                    
                    const dateObjet = chaineDate ? new Date(chaineDate.trim()) : new Date(0);
                    const dateEstValide = !isNaN(dateObjet.getTime()) && dateObjet.getTime() !== 0;
                    
                    let descriptionBrute = article.querySelector("description")?.textContent || article.querySelector("summary")?.textContent || "";
                    const fauxDiv = document.createElement("div");
                    fauxDiv.innerHTML = descriptionBrute;
                    const extraitTexte = fauxDiv.textContent || fauxDiv.innerText || "";
                    
                    let urlImage = null;
                    const enclosure = article.querySelector("enclosure[type^='image']");
                    if (enclosure) urlImage = enclosure.getAttribute("url");
                    
                    if (!urlImage) {
                        const mediaContent = article.getElementsByTagName("media:content")[0] || article.getElementsByTagName("media:thumbnail")[0];
                        if (mediaContent) urlImage = mediaContent.getAttribute("url");
                    }
                    
                    if (!urlImage) {
                        const expressionImage = /<img[^>]+src="([^">]+)"/i;
                        const correspondance = descriptionBrute.match(expressionImage);
                        if (correspondance && correspondance[1]) urlImage = correspondance[1];
                    }

                    baseArticlesGlobal.push({
                        titreSource: titreSource,
                        titreArticle: titreArticle.trim(),
                        lien: lienArticle ? lienArticle.trim() : "#",
                        extrait: extraitTexte.trim(),
                        dateObjet: dateEstValide ? dateObjet : new Date(0),
                        dateAffichee: dateEstValide ? dateObjet.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'}) : "Date inconnue",
                        urlImage: urlImage
                    });
                });
            } catch (e) {
                // Échec isolé ignoré
            }
        }

        /**
         * @function genererBoutonsFiltrage
         * @description Construit la barre de filtres et injecte en premier lieu le bouton de désélection globale.
         * @param {void}
         * @returns {void}
         */
        function genererBoutonsFiltrage() {
            const conteneurFiltres = document.getElementById("filter-container");
            conteneurFiltres.innerHTML = ""; 
            
            const boutonMaster = document.createElement("button");
            boutonMaster.className = "filter-btn clear-all";
            boutonMaster.textContent = "🗂️ Tout afficher";
            
            if (sourcesActives.size === 0) {
                boutonMaster.classList.add("active");
            }
            
            boutonMaster.addEventListener("click", () => {
                sourcesActives.clear(); 
                genererBoutonsFiltrage(); 
                genererRenduInterface();  
            });
            conteneurFiltres.appendChild(boutonMaster);
            
            const listeTriez = Array.from(listeSourcesUniques).sort();
            
            listeTriez.forEach(source => {
                const bouton = document.createElement("button");
                bouton.className = "filter-btn";
                bouton.textContent = source;
                
                if (sourcesActives.has(source)) {
                    bouton.classList.add("active");
                }
                
                bouton.addEventListener("click", () => {
                    if (sourcesActives.has(source)) {
                        sourcesActives.delete(source);
                    } else {
                        sourcesActives.add(source);
                    }
                    
                    genererBoutonsFiltrage();
                    genererRenduInterface();
                });
                
                conteneurFiltres.appendChild(bouton);
            });
        }

        /**
         * @function genererRenduInterface
         * @description Filtre la collection d'articles, vide la grille actuelle et reconstruit les cartes graphiques.
         * Déclenche l'analyse linguistique parallèle pour la traduction des titres et des extraits.
         * @param {void}
         * @returns {void}
         */
        function genererRenduInterface() {
            const conteneurTimeline = document.getElementById("timeline-container");
            
            const loader = document.getElementById("main-loader");
            if (loader) loader.remove();
            
            conteneurTimeline.innerHTML = "";
            
            const articlesAAfficher = sourcesActives.size === 0 
                ? baseArticlesGlobal 
                : baseArticlesGlobal.filter(art => sourcesActives.has(art.titreSource));
            
            if (articlesAAfficher.length === 0) {
                conteneurTimeline.innerHTML = "<div class='loader'>Aucun article ne correspond aux filtres activés.</div>";
                return;
            }
            
            articlesAAfficher.forEach(art => {
                const elementCarte = document.createElement("a");
                elementCarte.className = "article-card";
                elementCarte.href = art.lien;
                elementCarte.target = "_blank"; // Préservation stricte de la destination native externe
                
                // GESTION DES IDENTIFIANTS UNIQUE DU DOM (CIBLAGE INDÉPENDANT)
                const prefixeAleatoire = Math.random().toString(36).substring(2, 11);
                const idUniqueTitre = 'title-' + prefixeAleatoire;
                const idUniqueExtrait = 'excerpt-' + prefixeAleatoire;
                
                let blocMediaHTML = `
                    <div class="card-image-placeholder">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>`;
                    
                if (art.urlImage) {
                    blocMediaHTML = `<img src="${art.urlImage}" class="card-image" alt="Illustration" loading="lazy">`;
                }
                
                elementCarte.innerHTML = `
                    <div class="card-image-wrapper">
                        ${blocMediaHTML}
                    </div>
                    <div class="card-content">
                        <span class="card-source">${art.titreSource}</span>
                        <h2 class="card-title" id="${idUniqueTitre}">${art.titreArticle}</h2>
                        <p class="card-excerpt" id="${idUniqueExtrait}">${art.extrait ? art.extrait : "Consulter l'article complet pour analyser le contenu technique associé."}</p>
                        <div class="card-date">Publié le ${art.dateAffichee}</div>
                    </div>
                `;
                conteneurTimeline.appendChild(elementCarte);

                // EXPRESSION RÉGULIÈRE DE DÉTECTION LINGUISTIQUE (HEURISTIQUE SÉCTORIELLE)
                const regexAnglais = /\b(the|and|of|in|to|for|with|on|at|by|from|new|release|software|drone|satellite|surveying|update|news|gps|world|lidar|geospatial)\b/i;

                // ANALYSE ET DÉCLENCHEMENT DE LA TRADUCTION DU TITRE
                if (art.titreArticle) {
                    const titreEstAnglais = regexAnglais.test(art.titreArticle);
                    if (titreEstAnglais) {
                        lancerTraductionAsynchrone(idUniqueTitre, art.titreArticle, true);
                    }
                }

                // ANALYSE ET DÉCLENCHEMENT DE LA TRADUCTION DE L'EXTRAIT
                if (art.extrait && !art.extrait.startsWith("Consulter")) {
                    const extraitEstAnglais = regexAnglais.test(art.extrait);
                    if (extraitEstAnglais) {
                        lancerTraductionAsynchrone(idUniqueExtrait, art.extrait, false);
                    }
                }
            });
        }

        /**
         * @function lancerTraductionAsynchrone
         * @description Interroge en arrière-plan la passerelle gtx de Google Translate, parse la matrice de données
         * JSON retournée et met à jour dynamiquement l'élément cible dans le DOM avec le style graphique approprié.
         * @param {string} idDOM - L'identifiant unique de la balise HTML cible.
         * @param {string} texteOriginal - Le texte brut en langue étrangère à soumettre à l'API.
         * @param {boolean} estUnTitre - Flag booléen dictant la classe CSS structurelle à appliquer.
         * @returns {Promise<void>}
         */
        async function lancerTraductionAsynchrone(idDOM, texteOriginal, estUnTitre) {
            const urlTraduction = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q=${encodeURIComponent(texteOriginal)}`;
            
            try {
                const reponse = await fetch(urlTraduction);
                if (!reponse.ok) return;
                
                const structureJson = await reponse.json();
                let texteTraduitUnifie = "";
                
                // Algorithme de reconstruction : concaténation des segments de phrases gérés par l'API
                if (structureJson && structureJson[0]) {
                    structureJson[0].forEach(segment => {
                        if (segment[0]) texteTraduitUnifie += segment[0];
                    });
                }
                
                // Validation de modification : n'intervient que si le texte traduit diffère du texte source
                if (texteTraduitUnifie && texteTraduitUnifie.trim() !== texteOriginal.trim()) {
                    const conteneurCible = document.getElementById(idDOM);
                    if (conteneurCible) {
                        // Attribution de la classe CSS selon la nature sémantique de l'élément (titre vs paragraphe)
                        const classeAppliquee = estUnTitre ? 'translated-title' : 'translated-text';
                        conteneurCible.innerHTML = `<span class="${classeAppliquee}" title="Traduit automatiquement en français">${texteTraduitUnifie} ✨</span>`;
                    }
                }
            } catch (erreur) {
                console.warn("Échec du traitement de la traduction asynchrone pour l'élément : " + idDOM);
            }
        }
    </script>
</body>
</html>
