<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Veille Visuelle - Géomatique & Topographie</title>
    
    <style>
        /* ==========================================================================
           VARIABLES GLOBALES DE THÉMATISATION (DESIGN SYSTEM)
           ========================================================================== */
        :root {
            --primary-dark: #1a202c;     /* Anthracite profond pour les textes majeurs */
            --accent-red: #c53030;       /* Rouge institutionnel pour les rappels visuels */
            --bg-main: #f7fafc;          /* Fond de page neutre pour limiter la fatigue visuelle */
            --card-bg: #ffffff;          /* Blanc pur assurant le détachement des cartes */
            --text-muted: #718096;       /* Gris intermédiaire pour les métadonnées et sous-titres */
            --border-light: #e2e8f0;     /* Gris de délimitation pour les lignes de séparation */
            --radius-md: 12px;           /* Rayon de courbure des angles pour un aspect moderne */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--primary-dark);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* ==========================================================================
           JUSTIFICATION DE LA MISE EN PAGE ET DE L'ARCHITECTURE GRAPHIQUE
           ========================================================================== */
        
        /* FLEXBOX : Alignement horizontal de l'en-tête principal. L'utilisation de 
           'space-between' projette le titre à gauche et l'indicateur de configuration à droite, 
           s'adaptant nativement à la largeur de l'écran. */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-light);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 0;
        }

        /* GRID LAYOUT : Choix architectural indispensable pour l'affichage de cartes de taille uniforme.
           La fonction minmax(300px, 1fr) impose une contrainte de largeur minimale de 300px par carte. 
           Si l'espace disponible le permet, la grille calcule le nombre maximal de colonnes et distribue 
           équitablement le reliquat d'espace (1fr). */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        /* ==========================================================================
           COMPOSANTS : STRUCTURE DU BLOC DE CARTE (CARD ARCHITECTURE)
           ========================================================================== */
        
        /* FLEXBOX (Column) : La carte utilise Flexbox verticalement pour forcer les éléments 
           interne à se positionner régulièrement. 'height: 100%' garantit que toutes les cartes 
           d'une même ligne de la grille Grid partagent exactement la même hauteur. */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none; /* La carte entière est un lien cliquable */
            color: inherit;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* CONTENEUR IMAGE : Hauteur fixe imposée pour standardiser l'affichage. 
           La propriété 'object-fit: cover' est cruciale : elle force le navigateur à redimensionner 
           et recadrer l'image récupérée du flux RSS sans altérer son ratio d'aspect original (pas de distorsion). */
        .card-image-wrapper {
            width: 100%;
            height: 180px;
            background: #e2e8f0; /* Fond de secours pendant le chargement */
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* FALLBACK GÉOMÉTRIQUE : Génère un dégradé élégant si le flux RSS ne contient aucune image */
        .card-image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
            font-weight: bold;
            font-size: 2rem;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1; /* Force le contenu à occuper tout l'espace vertical disponible */
        }

        .card-source {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 10px 0;
            color: var(--primary-dark);
        }

        .card-excerpt {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Limite le résumé à exactement 3 lignes de texte */
            -webkit-box-orient: vertical;  
            overflow: hidden; /* Masque le texte excédentaire */
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: auto; /* Pousse la date au bas absolu de la carte pour l'alignement */
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Veille Technologique & Pédagogique - BTS MGTMN</h1>
        <small id="config-label" style="color: var(--text-muted);">Mode : Flux Chronologiques Combinés</small>
    </header>

    <main id="timeline-container" class="timeline-grid">
        <div class="loader" id="main-loader">Initialisation de la grille et synchronisation des flux...</div>
    </main>

    <script>
        // Tableau global destiné à stocker l'intégralité des articles extraits de toutes les sources
        let baseArticlesGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            initialiserApplication();
        });

        /**
         * @function initialiserApplication
         * @description Orchestre le cycle de vie de l'application : charge l'OPML, lance les requêtes 
         * en parallèle, trie les résultats et commande le rendu graphique.
         */
        async function initialiserApplication() {
            try {
                const reponse = await fetch('feeds.opml');
                if (!reponse.ok) throw new Error("Fichier 'feeds.opml' introuvable.");
                
                const chaineDonnees = await reponse.text();
                const parseur = new DOMParser();
                const documentXML = parseur.parseFromString(chaineDonnees, "text/xml");
                
                const elementsOutline = documentXML.querySelectorAll("outline[xmlUrl]");
                
                // ARCHITECTURE ASYNCHRONE : Création d'un tableau de promesses pour exécuter 
                // l'ensemble des requêtes HTTP distantes de manière concomitante (parallélisation).
                const promessesCollecte = Array.from(elementsOutline).map(outline => {
                    const titreSource = outline.getAttribute("title") || outline.getAttribute("text") || "Source";
                    const urlFlux = outline.getAttribute("xmlUrl");
                    return collecterDonneesFlux(titreSource, urlFlux);
                });
                
                // Attente de la résolution de toutes les requêtes (qu'elles réussissent ou échouent)
                await Promise.all(promessesCollecte);
                
                // ALGORITHME DE TRI CHRONOLOGIQUE : Classe les articles du plus récent au plus ancien.
                // Logique mathématique : Soustraction des horodatages Unix (timestamps) en millisecondes.
                baseArticlesGlobal.sort((a, b) => b.dateObjet - a.dateObjet);
                
                genererRenduInterface();
                
            } catch (erreur) {
                document.getElementById("timeline-container").innerHTML = `<div class="loader" style="color:#c53030;">Erreur critique : ${erreur.message}</div>`;
            }
        }

        /**
         * @function collecterDonneesFlux
         * @description Interroge un flux RSS/Atom via le proxy, extrait les données brutes et enrichit le tableau global.
         * @param {string} titreSource - Nom éditeur du flux.
         * @param {string} urlFlux - URL technique du flux.
         */
        async function collecterDonneesFlux(titreSource, urlFlux) {
            const urlRequeteProxiee = `https://corsproxy.io/?${encodeURIComponent(urlFlux)}`;
            
            try {
                const reponse = await fetch(urlRequeteProxiee);
                if (!reponse.ok) return; // Échec silencieux d'un flux pour ne pas bloquer l'application générale
                
                const texteBrut = await reponse.text();
                const parseur = new DOMParser();
                const xmlDoc = parseur.parseFromString(texteBrut, "text/xml");
                
                const estAtom = xmlDoc.querySelector("entry") !== null;
                const balisesArticles = estAtom ? xmlDoc.querySelectorAll("entry") : xmlDoc.querySelectorAll("item");
                
                Array.from(balisesArticles).slice(0, 5).forEach(article => {
                    const titreArticle = article.querySelector("title")?.textContent || "Sans titre";
                    
                    let lienArticle = "#";
                    if (estAtom) {
                        lienArticle = article.querySelector("link")?.getAttribute("href") || "#";
                    } else {
                        lienArticle = article.querySelector("link")?.textContent || "#";
                    }
                    
                    // Extraction et lissage de la date de publication
                    const chaineDate = article.querySelector("pubDate")?.textContent || article.querySelector("updated")?.textContent || article.querySelector("published")?.textContent || "";
                    const dateObjet = chaineDate ? new Date(chaineDate) : new Date(0); // Date zéro par défaut si absente
                    
                    // Extraction du résumé (nettoyage des balises HTML éventuelles)
                    let descriptionBrute = article.querySelector("description")?.textContent || article.querySelector("summary")?.textContent || "";
                    const fauxDiv = document.createElement("div");
                    fauxDiv.innerHTML = descriptionBrute;
                    const extraitTexte = fauxDiv.textContent || fauxDiv.innerText || "";
                    
                    // ALGORITHME POLYMORPHE D'EXTRACTION D'IMAGE : Analyse les structures courantes des flux
                    let urlImage = null;
                    
                    // 1. Recherche via la balise standard <enclosure>
                    const enclosure = article.querySelector("enclosure[type^='image']");
                    if (enclosure) urlImage = enclosure.getAttribute("url");
                    
                    // 2. Recherche via les balises de l'espace de noms Media (media:content / media:thumbnail)
                    if (!urlImage) {
                        const mediaContent = article.getElementsByTagName("media:content")[0] || article.getElementsByTagName("media:thumbnail")[0];
                        if (mediaContent) urlImage = mediaContent.getAttribute("url");
                    }
                    
                    // 3. Recherche par expression régulière d'une balise <img> injectée dans le corps textuel HTML
                    if (!urlImage) {
                        const expressionImage = /<img[^>]+src="([^">]+)"/i;
                        const correspondance = descriptionBrute.match(expressionImage);
                        if (correspondance && correspondance[1]) urlImage = correspondance[1];
                    }

                    // Stockage de l'entité normalisée dans le catalogue global
                    baseArticlesGlobal.push({
                        titreSource: titreSource,
                        titreArticle: titreArticle,
                        lien: lienArticle.trim(),
                        extrait: extraitTexte.trim(),
                        dateObjet: dateObjet,
                        dateAffichee: dateObjet.getTime() !== 0 ? dateObjet.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'}) : "Date inconnue",
                        urlImage: urlImage
                    });
                });
            } catch (e) {
                // Analyse en échec ignorée pour préserver la continuité des autres sources
            }
        }

        /**
         * @function genererRenduInterface
         * @description Parcourt le tableau d'éléments triés et injecte le code HTML des cartes graphiques.
         */
        function genererRenduInterface() {
            const conteneur = document.getElementById("timeline-container");
            const loader = document.getElementById("main-loader");
            
            if (loader) loader.remove();
            
            if (baseArticlesGlobal.length === 0) {
                conteneur.innerHTML = "<div class='loader'>Aucun article n'a pu être synchronisé.</div>";
                return;
            }
            
            baseArticlesGlobal.forEach(art => {
                const elementCarte = document.createElement("a");
                elementCarte.className = "article-card";
                elementCarte.href = art.lien;
                elementCarte.target = "_blank";
                
                // Construction conditionnelle du bloc média (Image vs Dégradé géométrique)
                let blocMediaHTML = `<div class="card-image-placeholder">3D</div>`;
                if (art.urlImage) {
                    blocMediaHTML = `<img src="${art.urlImage}" class="card-image" alt="Illustration" loading="lazy">`;
                }
                
                elementCarte.innerHTML = `
                    <div class="card-image-wrapper">
                        ${blocMediaHTML}
                    </div>
                    <div class="card-content">
                        <span class="card-source">${art.titreSource}</span>
                        <h2 class="card-title">${art.titreArticle}</h2>
                        <p class="card-excerpt">${art.extrait ? art.excerpt = art.extrait : "Consulter l'article complet pour analyser le contenu technique associé."}</p>
                        <div class="card-date">Publié le ${art.dateAffichee}</div>
                    </div>
                `;
                conteneur.appendChild(elementCarte);
            });
        }
    </script>
</body>
</html>
